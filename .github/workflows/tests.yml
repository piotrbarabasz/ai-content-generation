name: tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install headless Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libpulse0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run offline test suite
        run: python -m pytest backend/tests
      - name: Check patch whitespace
        run: git diff --check
