[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-studio"
version = "0.1.0"
description = "Backend foundation for the AI Content Studio MVP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "pytest>=8.0",
]

[project.optional-dependencies]
# Keep the real local TTS runtime out of the default application and CI install.
# Select torch and torchaudio separately for the target CPU/CUDA device; see
# docs/tts/CHATTERBOX_SETUP.md for the validated CUDA 12.4 combination.
chatterbox-v3 = [
  "chatterbox-tts==0.1.7",
  "resemble-perth==1.0.1",
  "setuptools<81",
]
piper = [
  "piper-tts",
]
xtts = [
  "TTS",
]
youtube = [
  "google-api-python-client>=2.177,<3",
  "google-auth>=2.40,<3",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
